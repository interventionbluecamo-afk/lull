<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="ig.css">
<style>
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;margin-top:56px;width:100%;}
  .tc{background:var(--card);border:1px solid var(--cardborder);border-radius:34px;padding:26px 14px 22px;text-align:center;box-shadow:0 18px 34px -24px rgba(61,31,14,.55);}
  .tc svg{width:148px;height:148px;display:block;margin:0 auto 6px;}
  .tc .n{font-family:Georgia,serif;font-size:37px;}
  .tc{position:relative;}
  .tc .free{position:absolute;top:16px;right:16px;background:var(--water);color:var(--clayink);font-size:19px;font-weight:800;letter-spacing:.04em;padding:5px 13px;border-radius:999px;text-transform:uppercase;}
</style></head>
<body>
  <div class="brand serif">lull<span class="dot">.</span></div>
  <div class="frame center" style="justify-content:center;">
    <div class="kicker">The toybox</div>
    <div class="headline" style="font-size:94px;margin-top:16px;">Six living toys.</div>
    <div class="sub" style="margin-top:14px;">Each one responds to touch like a creature, not a button.</div>
    <div class="grid">
      <div class="tc"><span class="free">Free</span>
        <svg viewBox="0 0 80 80"><circle cx="30" cy="46" r="18" fill="#85C5CF" opacity=".55"/><circle cx="52" cy="34" r="14" fill="#85C5CF" opacity=".7"/><circle cx="44" cy="54" r="10" fill="#85C5CF" opacity=".5"/><circle cx="25" cy="40" r="5" fill="#fff" opacity=".8"/><circle cx="48" cy="29" r="4" fill="#fff" opacity=".85"/></svg>
        <div class="n">Bubbles</div></div>
      <div class="tc">
        <svg viewBox="0 0 80 80"><circle cx="40" cy="42" r="26" fill="#EA8E82"/><circle cx="31" cy="40" r="3.4" fill="#3D1F0E"/><circle cx="49" cy="40" r="3.4" fill="#3D1F0E"/><ellipse cx="24" cy="48" rx="5" ry="3.4" fill="#D4583A" opacity=".5"/><ellipse cx="56" cy="48" rx="5" ry="3.4" fill="#D4583A" opacity=".5"/><path d="M32 50 Q40 60 48 50" fill="#A6473C"/></svg>
        <div class="n">Feed</div></div>
      <div class="tc">
        <svg viewBox="0 0 80 80"><rect x="22" y="50" width="36" height="13" rx="6.5" fill="#D4583A"/><rect x="26" y="38" width="28" height="12" rx="6" fill="#CDA96A"/><rect x="30" y="26" width="20" height="12" rx="6" fill="#E8C045"/><path d="M36 31 q.4-2 2-2 M44 31 q-.4-2-2-2" stroke="#3D1F0E" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M37 34 Q40 37 43 34" stroke="#3D1F0E" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <div class="n">Stack</div></div>
      <div class="tc">
        <svg viewBox="0 0 80 80"><rect x="38" y="40" width="4" height="26" rx="2" fill="#6A8B66"/><ellipse cx="50" cy="50" rx="9" ry="5" fill="#6A8B66" opacity=".85" transform="rotate(-25 50 50)"/><circle cx="40" cy="32" r="7" fill="#EA8E82"/><circle cx="52" cy="32" r="7" fill="#EA8E82"/><circle cx="40" cy="44" r="7" fill="#EA8E82"/><circle cx="52" cy="44" r="7" fill="#EA8E82"/><circle cx="46" cy="38" r="8" fill="#E8C045"/></svg>
        <div class="n">Bloom</div></div>
      <div class="tc">
        <svg viewBox="0 0 80 80"><rect x="32" y="58" width="6" height="9" rx="3" fill="#5C3320"/><rect x="42" y="58" width="6" height="9" rx="3" fill="#5C3320"/><rect x="28" y="40" width="24" height="22" rx="8" fill="#A08BBB"/><circle cx="40" cy="30" r="13" fill="#CDA96A"/><circle cx="35" cy="29" r="2.4" fill="#3D1F0E"/><circle cx="45" cy="29" r="2.4" fill="#3D1F0E"/><path d="M36 34 Q40 37 44 34" stroke="#3D1F0E" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        <div class="n">Mix-Up</div></div>
      <div class="tc">
        <svg viewBox="0 0 80 80"><ellipse cx="32" cy="46" rx="15" ry="11" fill="#85C5CF" opacity=".55"/><ellipse cx="48" cy="40" rx="14" ry="11" fill="#D4583A" opacity=".5"/><ellipse cx="40" cy="52" rx="13" ry="10" fill="#6A8B66" opacity=".5"/><path d="M46 30 l3.2 6.6 7.2 .9 -5.3 5 1.3 7.2 -6.4-3.5 -6.4 3.5 1.3-7.2 -5.3-5 7.2-.9z" fill="#E8C045"/></svg>
        <div class="n">Paint</div></div>
    </div>
  </div>
</body></html>
